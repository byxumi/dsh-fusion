name: Generate signing keystore (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          echo -n "$PASS" > pass.txt
          keytool -genkeypair -v \
            -keystore dsh-fusion.jks \
            -alias dsh-fusion \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=DSH-Fusion, OU=Mobile, O=DSH-Fusion, L=Beijing, ST=Beijing, C=CN" 2>&1 | tail -3
          base64 -w0 dsh-fusion.jks > dsh-fusion.jks.b64
          ls -la dsh-fusion.jks* pass.txt

      - name: Upload keystore (auth required to download)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-fusion-keystore
          path: dsh-fusion.jks.b64
          retention-days: 1

      - name: Upload password (auth required to download)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-fusion-keystore-pass
          path: pass.txt
          retention-days: 1